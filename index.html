<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letter Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="header">Love Letter</h1>
    
    <div id="form-container">
      <h2>Create Your Love Letter</h2>
      <form id="letter-form">
        <textarea id="love-letter" placeholder="Write your love letter here..." required></textarea>
        <button type="submit">Submit Letter</button>
      </form>
    </div>
    
    <div id="letter-display" style="display: none;">
      <h2>Your Love Letter</h2>
      <p id="display-letter"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
